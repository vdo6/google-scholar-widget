<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Google Scholar — Phuc Do</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#1b1b1b;color:#f7f7f7;font:16px Arial,Helvetica,sans-serif}.scholar{width:100%;max-width:940px;margin:0 auto;padding:16px 18px 30px;background:linear-gradient(130deg,#222,#151515)}h2{font-weight:300;font-size:29px;margin:0 0 22px}.metrics{display:flex;gap:40px;margin-bottom:15px}.metric-label{display:block;font-size:15px;margin-bottom:16px}.metric-value{display:block;font-size:29px;font-weight:300}.source{font-size:14px;color:#ccc;margin:10px 0 26px}.source a{color:#f13728}.scroll{overflow-x:auto;max-width:100%}svg{display:block;width:100%;height:auto;min-width:570px}svg text{font-family:Arial,Helvetica,sans-serif;fill:#f8f8f8}svg .gridline{stroke:#777;stroke-opacity:.52;stroke-width:1}svg .bar{fill:#d00000}svg .bar:hover{fill:#ff332a}.note{color:#bcbcbc;font-size:13px;margin:12px 0 0}.error{color:#ffc0b9}.sr-only{position:absolute;clip:rect(0,0,0,0);width:1px;height:1px;overflow:hidden}

/* Compact Google Scholar header */

/* Compact horizontal layout */

.scholar {
  display: grid;
  grid-template-columns: 1fr auto;
  column-gap: 20px;
  row-gap: 4px;
  align-items: start;
  padding: 10px 14px 16px;
}

.scholar h2 {
  grid-column: 1;
  grid-row: 1 / 3;
  font-size: 23px;
  line-height: 1.2;
  margin: 4px 0 0;
}

.scholar .metrics {
  grid-column: 2;
  grid-row: 1;
  display: flex;
  gap: 22px;
  margin: 0;
}

.scholar .metric-label {
  font-size: 12px;
  line-height: 1.2;
  margin-bottom: 5px;
}

.scholar .metric-value {
  font-size: 24px;
  line-height: 1.1;
}

.scholar .source {
  grid-column: 2;
  grid-row: 2;
  font-size: 11px;
  line-height: 1.2;
  margin: 4px 0 0;
}

.scholar .scroll,
.scholar .note {
  grid-column: 1 / -1;
}

.scholar .scroll {
  margin-top: 12px;
}

.scholar .note {
  margin-top: 6px;
}

/* Small screens */
@media (max-width: 600px) {
  .scholar {
    grid-template-columns: 1fr;
  }

  .scholar h2,
  .scholar .metrics,
  .scholar .source {
    grid-column: 1;
    grid-row: auto;
  }

  .scholar .metrics {
    gap: 20px;
  }
}


</style></head>
<body><section class="scholar" aria-labelledby="title"><h2 id="title">Google Scholar</h2><div class="metrics"><div><span class="metric-label">Citations</span><span class="metric-value" id="citations">—</span></div><div><span class="metric-label">h-index</span><span class="metric-value" id="hindex">—</span></div><div><span class="metric-label">i10-index</span><span class="metric-value" id="i10index">—</span></div></div><p class="source">According to <a href="https://scholar.google.com/citations?user=Xa97hl4AAAAJ&amp;hl=en" target="_blank" rel="noopener noreferrer">Google Scholar</a> · <span id="updated">Awaiting first successful update</span></p><div class="scroll"><svg id="chart" role="img" aria-label="Annual citations chart" viewBox="0 0 880 310" preserveAspectRatio="xMidYMid meet"><text x="20" y="90" font-size="16">Annual citation data unavailable until first update</text></svg></div><p class="note" id="status">The chart uses the last successfully retrieved values, not live requests to Google Scholar.</p></section>
<script>
'use strict';
// Same-origin data file, updated by the scheduled GitHub Actions workflow.
const DATA_URL = './scholar_data.json';
function n(v){return new Intl.NumberFormat('en-US').format(v)}
function elem(name, attrs={}, value){const e=document.createElementNS('http://www.w3.org/2000/svg',name);Object.entries(attrs).forEach(([k,v])=>e.setAttribute(k,String(v)));if(value!==undefined)e.textContent=String(value);return e}
function renderChart(points){const svg=document.getElementById('chart');svg.replaceChildren();if(!points.length){svg.appendChild(elem('text',{x:20,y:90,'font-size':16},'No annual data available'));return}const W=880,H=310,left=48,right=12,top=25,bottom=45,plotW=W-left-right,plotH=H-top-bottom;const max=Math.max(...points.map(p=>p.citations),1),tick=Math.max(1,Math.ceil(max/4/50)*50),upper=Math.ceil(max/(tick))*tick;for(let j=0;j<=4;j++){let val=upper*j/4,y=top+plotH-(j/4)*plotH;svg.append(elem('line',{x1:left,y1:y,x2:W-right,y2:y,class:'gridline'}),elem('text',{x:left-12,y:y+5,'text-anchor':'end','font-size':14},Math.round(val)))}const slot=plotW/points.length;points.forEach((p,i)=>{const x=left+slot*i+slot*.17,bw=slot*.66,h=p.citations/upper*plotH,y=top+plotH-h;let b=elem('rect',{x,y,width:bw,height:Math.max(0,h),class:'bar'});b.appendChild(elem('title',{},`${p.year}: ${n(p.citations)} citations`));svg.append(b,elem('text',{x:x+bw/2,y:Math.max(14,y-6),'text-anchor':'middle','font-size':12},p.citations),elem('text',{x:x+bw/2,y:H-16,'text-anchor':'middle','font-size':13},p.year))});svg.setAttribute('aria-label',points.map(p=>`${p.year}: ${p.citations} citations`).join('; '))}
async function load(){try{const r=await fetch(DATA_URL,{cache:'no-store'});if(!r.ok)throw Error(`HTTP ${r.status}`);const d=await r.json();if(d.scholar_id!=='Xa97hl4AAAAJ')throw Error('Wrong scholar ID');for(const k of ['citations','hindex','i10index'])if(!Number.isInteger(d[k])||d[k]<0)throw Error('Invalid '+k);let p=Object.entries(d.cites_per_year||{}).map(([year,citations])=>({year:Number(year),citations:Number(citations)})).filter(x=>Number.isInteger(x.year)&&x.year>=1900&&Number.isInteger(x.citations)&&x.citations>=0).sort((a,b)=>a.year-b.year);document.getElementById('citations').textContent=n(d.citations);document.getElementById('hindex').textContent=n(d.hindex);document.getElementById('i10index').textContent=n(d.i10index);document.getElementById('updated').textContent='Updated '+(d.updated||'unknown date');document.getElementById('status').textContent='Source: Google Scholar · Last successfully retrieved snapshot';renderChart(p)}catch(err){document.getElementById('status').textContent='Automatic data is not yet available ('+err.message+'). Profile link remains accessible.';document.getElementById('status').classList.add('error')}}load();
</script></body></html>
