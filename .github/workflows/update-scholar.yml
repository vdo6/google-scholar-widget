name: Update Google Scholar statistics

on:
  schedule:
    - cron: '25 7 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Update Google Scholar data
        continue-on-error: true
        timeout-minutes: 2
        run: python -u update_scholar.py

      
      - name: Generate Google Scholar image
        run: python render_scholar.py
     
      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add scholar_data.json scholar.png scholar-small.png

          if ! git diff --cached --quiet; then
            git commit -m "Update Scholar data"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
